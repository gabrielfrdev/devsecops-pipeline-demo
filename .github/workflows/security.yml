name: security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: npm audit --audit-level=high

  sast:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs
            p/owasp-top-ten
          generateSarif: '1'

      - uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: semgrep.sarif

  container:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build image
        run: docker build -t demo-app .

      - name: scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: demo-app
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy.sarif

      - uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: trivy.sarif

      - name: generate sbom
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: demo-app
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  iac:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: scan dockerfile and actions
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - uses: github/codeql-action/upload-sarif@v4.37.4
        if: always()
        with:
          sarif_file: checkov.sarif

  lint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: npm run lint

  test:
    name: jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  dast:
    name: zap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: start app
        run: node src/index.js &

      - name: wait for health
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/health && break
            echo "waiting... ($i)"
            sleep 2
          done
          curl -sf http://localhost:3000/health || (echo "app failed to start" && exit 1)

      - name: zap baseline scan
        uses: zaproxy/action-baseline-scan@v0.14.0
        with:
          target: 'http://localhost:3000'
          allow_issue_writing: false
          fail_action: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
